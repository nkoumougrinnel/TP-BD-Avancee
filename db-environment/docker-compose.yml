version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: postgres_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydatabase
    ports:
      - "5432:5432"
    volumes:
      - ./postgres:/var/lib/postgresql

  mongodb:
    image: mongo:6.0
    container_name: mongo_db
    ports:
      - "27017:27017"
    volumes:
      - ./mongodb/data:/data/db

  redis:
    image: redis:7.2
    container_name: redis_db
    ports:
      - "6379:6379"

  cassandra:
    image: cassandra:4.1
    container_name: cassandra_db
    ports:
      - "9042:9042"
    volumes:
      - ./cassandra/data:/var/lib/cassandra

  neo4j:
    image: neo4j:latest
    container_name: neo4j_db
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/password
    volumes:
      - ./neo4j/data:/data

  rstudio:
    image: rocker/rstudio:latest
    container_name: rstudio_env
    environment:
      PASSWORD: password
    ports:
      - "8787:8787"
    volumes:
      - ./rstudio/home:/home/rstudio
